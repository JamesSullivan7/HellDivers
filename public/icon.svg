<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" fill="#0a0a0b"/>
  <g transform="translate(256 256)">
    <!-- Outer crosshair circle -->
    <circle cx="0" cy="0" r="180" stroke="#F1D434" stroke-width="14" fill="none"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="100" stroke="#F1D434" stroke-width="10" fill="none"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="22" fill="#F1D434"/>
    <!-- Crosshair lines -->
    <line x1="-220" y1="0" x2="-160" y2="0" stroke="#F1D434" stroke-width="14" stroke-linecap="round"/>
    <line x1="160" y1="0" x2="220" y2="0" stroke="#F1D434" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="-220" x2="0" y2="-160" stroke="#F1D434" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="160" x2="0" y2="220" stroke="#F1D434" stroke-width="14" stroke-linecap="round"/>
    <!-- Eagle silhouette (simplified) -->
    <path d="M -60 -10 L 0 -50 L 60 -10 L 30 0 L 30 30 L -30 30 L -30 0 Z" fill="#0a0a0b" stroke="#F1D434" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
